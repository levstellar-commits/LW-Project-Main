<!-- ==========================================================================
     [新骚操作] 让所有子页面自动具备全功能登录舱，无需修改子页面 HTML 结构
     ========================================================================== -->
<div id="lv-login-modal" class="lv-modal-overlay" style="display: none;">
    <div class="lv-modal-content glass-panel">
        <button class="lv-modal-close" onclick="closeLoginModal()">×</button>
        <div class="lv-modal-header">
            <h3 class="lv-modal-title">星门准入协议</h3>
            <p class="lv-modal-subtitle">验证身份波段，确立你的文明坐标</p>
        </div>
        <div class="lv-modal-body">
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="lv-btn-social wechat" style="flex: 1; padding: 10px; font-size: 13px; background: rgba(0,0,0,0.4); border: 1px solid #00c864; color: #00c864; border-radius: 4px;">🟢 微信接入</button>
                <button class="lv-btn-social qq" style="flex: 1; padding: 10px; font-size: 13px; background: rgba(0,0,0,0.4); border: 1px solid #0096ff; color: #0096ff; border-radius: 4px;">🔵 QQ接入</button>
            </div>
            <div class="lv-input-group" style="margin-bottom: 10px;"><input type="text" placeholder="设置文明代号" class="lv-input"></div>
            <button class="lv-btn-primary" style="width: 100%; background: #00e5ff; color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 4px; margin-top: 10px;" onclick="alert('系统提示：星门节点正在备案！');">建立锚点</button>
        </div>
    </div>
</div>

<script>
// 全局弹窗控制函数，挂载到 window 确保全局任何地方调用都不会报错
window.openLoginModal = function() {
    const modal = document.getElementById('lv-login-modal');
    if(modal) {
        modal.style.display = 'flex';
        setTimeout(() => { modal.classList.add('active'); }, 10);
    }
};
window.closeLoginModal = function() {
    const modal = document.getElementById('lv-login-modal');
    if(modal) {
        modal.classList.remove('active');
        setTimeout(() => { modal.style.display = 'none'; }, 300);
    }
};
</script>
